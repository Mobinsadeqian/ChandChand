<h1>چندچند</h1>

<a href="{% url 'league_page' league.code %}"><button>{{league.persian_name}}<br></button></a>
{% endfor %}
<br><br><br>
{% for math in today_matches %}
{{math.league}}: {{math.home_team.persian_name}} VS {{math.away_team.persian_name}}

{% endfor %}

{% endfor %}
